<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安得烈食物銀行全螢幕數位時鐘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #00529B;
      --accent-gold: #F5A623;
      --warm-amber: #FF9800;
      --soft-white: #F8FAF9;
      --glass-bg: rgba(7, 24, 48, 0.45);
      --glass-border: rgba(255, 255, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #031020;
      color: var(--soft-white);
    }

    /* 牆面與動態背景 */
    .bg-stage {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .bg-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0;
      transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
      background-size: cover;
      background-position: center;
      transform: scale(1.02);
    }

    .bg-layer.active { opacity: 1; }

    .bg-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(3, 16, 32, 0.25) 0%, rgba(2, 10, 20, 0.8) 100%);
      z-index: 2;
    }

    .bg-svg { width: 100%; height: 100%; object-fit: cover; }

    /* 主版面佈局 */
    .clock-app-container {
      position: relative;
      z-index: 10;
      width: 100vw; height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.2vh 2vw;
    }

    /* 頂部標題列 */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 36px;
      background: rgba(0, 30, 60, 0.65);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 20px;
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand-section { display: flex; align-items: center; gap: 28px; }
    
    .official-logo-box {
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 12px rgba(245, 166, 35, 0.4));
    }

    .brand-titles { display: flex; flex-direction: column; }

    .brand-title-main {
      font-size: clamp(2.6rem, 4.4vh, 4rem);
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #FFFFFF 0%, #E0EBF5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 3px 12px rgba(0,0,0,0.6);
      line-height: 1.15;
    }

    .brand-title-sub {
      font-size: clamp(1.2rem, 2.1vh, 1.9rem);
      color: var(--accent-gold);
      letter-spacing: 2px;
      font-weight: 700;
      margin-top: 4px;
    }

    .date-lunar-display { text-align: right; }
    .date-text { font-size: clamp(1.8rem, 3.2vh, 2.6rem); font-weight: 700; color: #FFFFFF; letter-spacing: 1px; }
    .lunar-text { font-size: clamp(1.2rem, 2vh, 1.6rem); color: #D1E3F8; margin-top: 2px; }

    /* 核心時間框 */
    .main-clock-card {
      position: relative;
      width: 100%;
      height: 52vh;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.05), 0 20px 50px rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0 1vw;
    }

    .time-wrapper {
      position: relative;
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center; gap: 15px;
    }

    .time-hm {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(13rem, 38vh, 35vw);
      font-weight: 700;
      line-height: 0.75;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.25), 0 12px 35px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
      display: flex; align-items: center;
    }

    .colon {
      color: var(--accent-gold);
      display: inline-block;
      margin: 0 -0.01em;
      animation: pulseColon 2s infinite;
      text-shadow: 0 0 25px rgba(245, 166, 35, 0.7);
    }

    .ampm-tag {
      position: absolute;
      top: 2.5vh; left: 2.5vw;
      font-size: clamp(1.8rem, 4.5vh, 3vw);
      font-weight: 900;
      color: var(--accent-gold);
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 28px;
      border-radius: 14px;
      border: 2px solid rgba(245, 166, 35, 0.8);
      letter-spacing: 2px;
      cursor: pointer;
      z-index: 60;
      pointer-events: auto;
      transition: all 0.2s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    .ampm-tag:hover {
      background: var(--primary-blue);
      color: #FFFFFF;
      transform: scale(1.1);
    }

    /* 時鐘窗格右上角的全螢幕解鎖按鈕 */
    .lock-trigger-btn {
      position: absolute;
      top: 2.5vh;
      right: 2.5vw;
      z-index: 70;
      background: rgba(180, 40, 40, 0.85);
      border: 2px solid rgba(255, 120, 120, 0.8);
      color: white;
      padding: 10px 22px;
      border-radius: 14px;
      cursor: pointer;
      font-size: clamp(1.2rem, 2.5vh, 1.8rem);
      font-weight: 900;
      display: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    .lock-trigger-btn:hover {
      background: #E53935;
      transform: scale(1.08);
      box-shadow: 0 0 25px rgba(229, 57, 53, 0.8);
    }

    .alarm-icons-container { display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; }
    .alarm-icon-item {
      font-size: clamp(2.5rem, 6vh, 4.5rem);
      animation: pulseAlarm 2s infinite alternate;
      filter: drop-shadow(0 0 10px var(--accent-gold));
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .alarm-icon-item.ringing {
      font-size: clamp(8rem, 20vh, 16vw) !important;
      animation: alarmRinging 0.2s infinite alternate !important;
      filter: drop-shadow(0 0 45px #FF2222) !important;
      z-index: 100;
      cursor: pointer;
    }

    @keyframes alarmRinging {
      0% { transform: scale(1) rotate(-18deg); opacity: 1; }
      100% { transform: scale(1.25) rotate(18deg); opacity: 0.85; }
    }
    @keyframes pulseAlarm { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.18); opacity: 1; } }
    @keyframes pulseColon { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .seconds-badge {
      position: absolute; bottom: 2vh; right: 2.5vw;
      background: rgba(0, 20, 45, 0.75);
      border: 1.5px solid var(--accent-gold);
      border-radius: 16px;
      padding: 0.4vh 1.8vw;
      display: flex; align-items: baseline; gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .seconds-label { font-size: 1.2rem; color: var(--accent-gold); font-weight: 700; }
    .time-sec { font-family: 'Chakra Petch', sans-serif; font-size: clamp(3rem, 8vh, 6.5vw); font-weight: 700; color: #FFFFFF; line-height: 1; }

    /* 底部區域 */
    footer { width: 100%; display: flex; justify-content: space-between; align-items: center; position: relative; }

    .quote-box {
      width: 100%;
      background: rgba(1, 18, 38, 0.82);
      border-left: 10px solid var(--accent-gold);
      padding: 18px 36px;
      border-radius: 0 20px 20px 0;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      min-height: 15vh;
      display: flex; flex-direction: column; justify-content: center;
    }

    .quote-text { font-size: clamp(1.8rem, 3.2vh, 2.6rem); font-weight: 700; color: #E2EFFC; letter-spacing: 1.5px; line-height: 1.35; transition: opacity 0.5s ease; }
    .announcement-text { font-size: clamp(2.8rem, 5vh, 4.2rem); font-weight: 900; color: var(--warm-amber); margin-top: 8px; letter-spacing: 2px; text-shadow: 0 3px 12px rgba(0,0,0,0.8); line-height: 1.2; }

    .quote-box.custom-active .quote-text { display: none; }
    .quote-box.custom-active .announcement-text {
      font-size: clamp(5.5rem, 12vh, 10.5rem);
      font-weight: 900;
      color: #FFD700;
      margin-top: 0;
      text-align: center;
      letter-spacing: 4px;
      text-shadow: 
        0 4px 0 #000,
        0 -4px 0 #000,
        4px 0 0 #000,
        -4px 0 0 #000,
        0 0 30px rgba(255, 215, 0, 0.7);
      animation: slowBlink 3.5s infinite ease-in-out;
    }

    @keyframes slowBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .bg-switch-btn {
      position: absolute; right: 1.5vw; bottom: 1.5vh; z-index: 30;
      background: rgba(0, 30, 60, 0.75); border: 2px solid var(--accent-gold); color: var(--accent-gold);
      width: 52px; height: 52px; border-radius: 50%;
      cursor: pointer; font-size: 1.8rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(10px); box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
    }

    .bg-switch-btn:hover { background: var(--accent-gold); color: #000; transform: scale(1.12); }

    /* 控制面板選單 */
    .menu-btn {
      position: absolute; top: 20px; right: 20px; z-index: 100;
      background: rgba(0, 40, 80, 0.6); border: 1px solid var(--glass-border); color: white;
      width: 48px; height: 48px; font-size: 1.4rem; border-radius: 50%;
      cursor: pointer; display: flex; justify-content: center; align-items: center;
      transition: all 0.3s; opacity: 0.4;
    }

    .menu-btn:hover { opacity: 1; transform: scale(1.1); }

    .drawer {
      position: fixed; top: 0; right: -450px;
      width: 420px; height: 100%;
      background: rgba(4, 18, 36, 0.96); backdrop-filter: blur(20px);
      z-index: 90; box-shadow: -10px 0 30px rgba(0,0,0,0.8);
      padding: 30px 25px; transition: right 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex; flex-direction: column; gap: 18px;
      border-left: 1px solid var(--glass-border); overflow-y: auto;
    }

    .drawer.open { right: 0; }
    .drawer-title { font-size: 1.4rem; color: var(--accent-gold); border-bottom: 2px solid rgba(245, 166, 35, 0.3); padding-bottom: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    .control-label { font-size: 1rem; color: #B0C4DE; font-weight: bold; }
    .btn-row { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 10px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
    .btn.active, .btn:hover { background: var(--primary-blue); border-color: var(--accent-gold); color: var(--accent-gold); }

    .input-field, .select-field { width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: white; border-radius: 8px; font-size: 0.95rem; }
    .select-field option { background: #041224; color: white; }

    .alarm-list { display: flex; flex-direction: column; gap: 8px; max-height: 140px; overflow-y: auto; }
    .alarm-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.08); padding: 8px 12px; border-radius: 8px; border-left: 3px solid var(--accent-gold); }
    .alarm-time-label { font-size: 0.95rem; font-weight: bold; color: #FFF; }
    .alarm-delete-btn { background: #ff4d4d; border: none; color: white; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- 控制面板觸發鈕 -->
  <button class="menu-btn" id="menuToggle">⚙️</button>

  <!-- 側邊控制面板 -->
  <div class="drawer" id="drawer">
    <div class="drawer-title">安得烈食物銀行全螢幕數位時鐘</div>

    <div class="control-group">

      <div class="btn-row" style="gap:5px;">

        <span style="align-self: center; font-weight: bold;">:</span>
        <select id="alarmMinuteSelect" class="select-field" style="flex:1;"></select>

      <input type="text" id="alarmLabelInput" class="input-field" placeholder="標籤範例：晨禱提醒 / 食物箱發放" style="margin-top: 4px;">
      
      <div class="control-label" style="margin-top: 5px;">鬧鐘鈴聲與持續秒數</div>
      <div class="btn-row" style="gap:5px;">
        <select id="alarmSoundSelect" class="select-field" style="flex:2.5;">
          <option value="sound1">🔔 經典清脆 (Classic Chime)</option>
          <option value="sound2">🎵 溫和和弦 (Soft Chord)</option>
          <option value="sound3">🚨 急促警示 (Urgent Alert)</option>
          <option value="sound4">⛪ 優雅鐘聲 (Church Bell)</option>
          <option value="sound5">📟 活力嗶嗶 (Digital Beep)</option>

        <select id="alarmDurationSelect" class="select-field" style="flex:1.5;">

          <option value="30" selected>30 秒</option>

      <button class="btn" id="btnAddAlarm" style="background:var(--primary-blue); color:var(--accent-gold); margin-top: 5px;">＋ 新增鬧鐘</button>
      <div class="alarm-list" id="alarmList"></div>
    </div>

    <div class="control-group">
      <div class="control-label">自訂活動公告 (填寫將覆蓋經文輪播)</div>
      <input type="text" id="announcementInput" class="input-field" placeholder="範例：歡迎參加社團法人中華安得烈慈善協會感恩禮拜">
    </div>

    <div class="control-group" style="margin-top: auto; padding-top: 10px; gap: 10px;">
      <button class="btn" id="btnFullscreen" style="background: var(--accent-gold); color: #000;">開啟全螢幕</button>
      <button class="btn" id="btnLockMode" style="background: #D32F2F; color: #FFF;">🔒 鎖定全螢幕 (需密碼解鎖)</button>
    </div>
  </div>

  <div class="bg-stage">
    <div class="bg-layer active" id="bg1">
      <svg class="bg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="bgG1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#021B38"/><stop offset="50%" stop-color="#003366"/><stop offset="100%" stop-color="#00152B"/></linearGradient></defs>
        <rect width="100%" height="100%" fill="url(#bgG1)"/>
        <circle cx="960" cy="540" r="480" fill="none" stroke="rgba(245, 166, 35, 0.08)" stroke-width="2"/>
        <path d="M 0,800 Q 480,700 960,850 T 1920,750 L 1920,1080 L 0,1080 Z" fill="rgba(0, 82, 155, 0.3)"/>
        <path d="M 0,850 Q 550,950 1100,820 T 1920,900 L 1920,1080 L 0,1080 Z" fill="rgba(245, 166, 35, 0.12)"/>
      </svg>
    </div>
    <div class="bg-layer" id="bg2">
      <svg class="bg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0A2540"/><stop offset="60%" stop-color="#004080"/><stop offset="100%" stop-color="#051329"/></linearGradient></defs>
        <rect width="100%" height="100%" fill="url(#bgG2)"/>
        <path d="M-100,200 C 400,100 800,500 1920,100 L 1920,1080 L -100,1080 Z" fill="rgba(255, 152, 0, 0.08)"/>
        <circle cx="300" cy="300" r="280" fill="rgba(0, 82, 155, 0.25)"/>
      </svg>
    </div>
    <div class="bg-layer" id="bg3">
      <svg class="bg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="bgG3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#001F3F"/><stop offset="50%" stop-color="#002D5A"/><stop offset="100%" stop-color="#081426"/></linearGradient></defs>
        <rect width="100%" height="100%" fill="url(#bgG3)"/>
        <polygon points="0,0 1920,1080 0,1080" fill="rgba(0, 82, 155, 0.15)"/>
      </svg>
    </div>
    <div class="bg-layer" id="bg4">
      <svg class="bg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="bgG4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#051A30"/><stop offset="50%" stop-color="#032D55"/><stop offset="100%" stop-color="#010D1B"/></linearGradient></defs>
        <rect width="100%" height="100%" fill="url(#bgG4)"/>
        <circle cx="1600" cy="200" r="400" fill="rgba(245, 166, 35, 0.06)"/>
      </svg>
    </div>
    <div class="bg-overlay"></div>
  </div>

  <div class="clock-app-container">
    <header>
      <div class="brand-section">
        <div class="official-logo-box">
          <svg width="210" height="110" viewBox="0 0 240 140" fill="none" xmlns="http://www.w3.org/2000/svg">

      <div class="date-lunar-display">

    <main class="main-clock-card">
      <div class="ampm-tag" id="ampmTag" title="點擊切換 12/24 小時制">24H</div>

  <script>
    const dailyBreadVerses = [
      "「主耶和華的靈在我身上，因為耶和華用膏膏我，叫我傳好信息給貧窮的人。」— 以賽亞書 61:1",

      "「你們要先求祂的國和祂的義，這些東西都要加給你們了。」— 馬太福音 6:33",
      "「耶和華是我的牧者，我必不致缺乏。」— 詩篇 23:1",
      "「應當一無掛慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。」— 腓立比書 4:6",
      "「神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。」— 腓立比書 4:7",
      "「我的神必照祂榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足。」— 腓立比書 4:19",
      "「你要專心仰賴耶和華，不可倚靠自己的聰明，在你一切所行的事上都要認定祂，祂必指引你的路。」— 箴言 3:5-6",
      "「耶和華的慈愛永不止息，祂的憐憫永不斷絕，每早晨這都是新的。」— 耶利米哀歌 3:22-23",
      "「愛是恆久忍耐，又有恩慈；愛是不嫉妒，愛是不自誇，不張狂。」— 哥林多前書 13:4",
      "「如今常存的有信，有望，有愛這三樣，其中最大的是愛。」— 哥林多前書 13:13",
      "「你們光也當這樣照在人前，叫他們看見你們的好行為，便將榮耀歸給你們在天上的父。」— 馬太福音 5:16",
      "「神就是愛；住在愛裡面的，就是住在神裡面，神也住在祂裡面。」— 約翰一書 4:16",
      "「喜樂的心乃是良藥；憂傷的靈使骨枯乾。」— 箴言 17:22",
      "「但那等候耶和華的必重新得力。他們必如鷹展翅上騰；他們奔跑卻不困倦，行走卻不疲乏。」— 以賽亞書 40:31",

      "「當將你的事交託耶和華，並倚靠祂，祂就必成全。」— 詩篇 37:5",
      "「你的話是我腳前的燈，是我路上的光。」— 詩篇 119:105",
      "「耶和華近前聽求告祂的人，就是誠心求告祂的人。」— 詩篇 145:18",
      "「忍受試煉的人是有福的，因為他經過試驗以後，必得生命的冠冕。」— 雅各書 1:12",
      "「你們要彼此相愛，像我愛你們一樣，這就是我的命令。」— 約翰福音 15:12",
      "「我們曉得萬事都互相效力，叫愛神的人得益處。」— 羅馬書 8:28",
      "「若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。」— 哥林多後書 5:17",
      "「恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。」— 以弗所書 4:32",
      "「你要保守你心，勝過保守一切，因為一生的一效是由心發出。」— 箴言 4:23",
      "「耶和華是我的亮光，是我的拯救，我還怕誰呢？」— 詩篇 27:1",
      "「得勝的，我要賜他在我寶座上與我同坐。」— 啟示錄 3:21",
      "「凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。」— 馬太福音 11:28",
      "「這是我所命令你的：你當剛強壯膽！不要懼怕，也不要驚晃。」— 約書亞記 1:9",
      "「你們要敬畏耶和華，誠誠實實地盡心事奉祂，想念祂為你們所做的事何等的大。」— 撒母耳記上 12:24",
      "「愛人不可虛假；惡，要厭惡；善，要親近。」— 羅馬書 12:9",
      "「在患難中要忍耐，禱告要恆心。」— 羅馬書 12:12",
      "「少種的少收，多種的多收，這話是真的。」— 哥林多後書 9:6",
      "「我們行善，不可喪志；若不灰心，到了時候就要收成。」— 加拉太書 6:9",
      "「要常常喜樂，不住地禱告，凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。」— 帖煞羅尼迦前書 5:16-18",
      "「但願使人有盼望的神，因信將諸般的喜樂、平安充滿你們的心。」— 羅馬書 15:13",
      "「耶和華必為你們爭戰，你們只管靜默，不要作聲。」— 出埃及記 14:14",
      "「神為愛祂的人所預備的是眼睛未曾看見，耳朵未曾聽見的。」— 哥林多前書 2:9",
      "「流淚撒種的，必歡呼收割！」— 詩篇 126:5",
      "「你的日子如何，你的力量也必如何。」— 申命記 33:25",
      "「我留下平安給你們；我將我的平安賜給你們。」— 約翰福音 14:27",
      "「神是我們的避難所，是我們的力量，是我們在患難中隨時的幫助。」— 詩篇 46:1",
      "「堅心倚賴你的，你必保守他十分平安，因為他倚靠你。」— 以賽亞書 26:3",
      "「凡事謙虛、溫柔、忍耐，用愛心互相寬容。」— 以弗所書 4:2",
      "「主是我在急難中的力量，是我心中的磐石。」— 詩篇 73:26",
      "「要彼此相愛，像我愛你們一樣；這是我的命令。」— 約翰福音 15:12",
      "「主的恩典乃是一生之久；一宿雖有哭泣，早晨便必歡呼。」— 詩篇 30:5",
      "「你們要嘗嘗主恩的滋味，便知祂是美善；投靠祂的人有福了！」— 詩篇 34:8"
    ];

    let is24Hour = true;
    let autoRotate = true;
    let bgIndex = 0;
    const cycleDuration = 30;
    let secondsElapsed = 0;
    let alarms = [];
    let ringingTimers = {};
    let isCustomAnnouncementActive = false;

    // 全螢幕鎖定狀態與內建解鎖密碼
    let isLocked = false;
    const UNLOCK_PASSWORD = "26328803";

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playAlarmSound(type) {
      if (audioCtx.state === 'suspended') { audioCtx.resume(); }
      const now = audioCtx.currentTime;
      switch(type) {
        case 'sound1': playTone(523.25, now, 0.15, 'sine'); playTone(659.25, now + 0.15, 0.15, 'sine'); playTone(783.99, now + 0.3, 0.3, 'sine'); break;
        case 'sound2': playTone(440, now, 0.6, 'triangle'); playTone(554.37, now + 0.05, 0.6, 'triangle'); playTone(659.25, now + 0.1, 0.6, 'triangle'); break;
        case 'sound3': for(let i=0; i<4; i++) playTone(880, now + i*0.12, 0.08, 'sawtooth'); break;
        case 'sound4': playTone(329.63, now, 1.2, 'sine'); playTone(261.63, now + 0.4, 1.5, 'sine'); break;
        case 'sound5': playTone(1046.50, now, 0.08, 'square'); playTone(1046.50, now + 0.15, 0.08, 'square'); playTone(1046.50, now + 0.3, 0.15, 'square'); break;
      }
    }

    function playTone(freq, startTime, duration, type='sine') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.3, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(startTime); osc.stop(startTime + duration);
    }

    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const ampmTag = document.getElementById('ampmTag');
    const dateTextEl = document.getElementById('dateText');
    const quoteBox = document.getElementById('quoteBox');
    const quoteTextEl = document.getElementById('quoteText');
    const announcementTextEl = document.getElementById('announcementText');
    const alarmIconsContainer = document.getElementById('alarmIconsContainer');
    const alarmList = document.getElementById('alarmList');
    const alarmHourSelect = document.getElementById('alarmHourSelect');
    const alarmMinuteSelect = document.getElementById('alarmMinuteSelect');

    function initAlarmSelects() {
      alarmHourSelect.innerHTML = '';
      alarmMinuteSelect.innerHTML = '';
      for (let i = 0; i < 24; i++) {
        const val = String(i).padStart(2, '0');
        alarmHourSelect.innerHTML += `<option value="${val}">${val} 時</option>`;
      }
      for (let i = 0; i < 60; i += 5) {
        const val = String(i).padStart(2, '0');
        alarmMinuteSelect.innerHTML += `<option value="${val}">${val} 分</option>`;
      }
    }

    function formatAlarmDisplay(time24) {
      let [h, m] = time24.split(':').map(Number);
      if (is24Hour) {
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      } else {
        const period = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
        return `${period} ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }
    }

    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      const current24HourStr = `${String(h).padStart(2, '0')}:${m}`;

      if (!is24Hour) {
        ampmTag.innerText = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
      } else {
        ampmTag.innerText = '24H';
      }

      hoursEl.innerText = String(h).padStart(2, '0');
      minutesEl.innerText = m;
      secondsEl.innerText = s;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      dateTextEl.innerText = `${year}年${month}月${date}日 ${days[now.getDay()]}`;

      if (s === '00') {
        alarms.forEach(alarm => {
          if (alarm.time24 === current24HourStr && !alarm.triggered) {
            triggerAlarm(alarm);
          }
        });
      }
    }

    function toggleTimeFormat(e) {
      if (e) e.stopPropagation();
      is24Hour = !is24Hour;
      updateClock();
      renderAlarms();
    }

    ampmTag.addEventListener('click', toggleTimeFormat);
    ampmTag.addEventListener('touchstart', toggleTimeFormat, {passive: true});

    function triggerAlarm(alarm) {
      alarm.triggered = true;
      const iconEl = document.getElementById(`alarm-icon-${alarm.id}`);
      if (iconEl) {
        iconEl.classList.add('ringing');
      }

      let elapsedSeconds = 0;
      const duration = parseInt(alarm.duration) || 30;

      ringingTimers[alarm.id] = setInterval(() => {
        playAlarmSound(alarm.sound);
        elapsedSeconds += 2;
        if (elapsedSeconds >= duration) {
          stopRinging(alarm.id);
        }
      }, 2000);
    }

    function stopRinging(alarmId) {
      if (ringingTimers[alarmId]) {
        clearInterval(ringingTimers[alarmId]);
        delete ringingTimers[alarmId];
      }
      const iconEl = document.getElementById(`alarm-icon-${alarmId}`);
      if (iconEl) {
        iconEl.classList.remove('ringing');
      }
    }

    function renderAlarms() {
      alarmList.innerHTML = '';
      alarmIconsContainer.innerHTML = '';

      alarms.forEach((alarm) => {
        const displayTime = formatAlarmDisplay(alarm.time24);
        const item = document.createElement('div');
        item.className = 'alarm-item';
        item.innerHTML = `
          <div class="alarm-time-label">⏰ ${displayTime} (${alarm.duration}s) <span style="font-size:0.85rem; color:#F5A623;">${alarm.label ? ' - ' + alarm.label : ''}</span></div>
          <button class="alarm-delete-btn" onclick="deleteAlarm(${alarm.id})">刪除</button>
        `;
        alarmList.appendChild(item);

        const icon = document.createElement('div');
        icon.className = 'alarm-icon-item';
        icon.id = `alarm-icon-${alarm.id}`;
        icon.innerText = '⏰';
        icon.title = `鬧鐘: ${displayTime} ${alarm.label} (點擊即可關閉鬧鐘)`;
        icon.addEventListener('click', () => stopRinging(alarm.id));
        alarmIconsContainer.appendChild(icon);
      });
    }

    function addAlarm(hour, minute, label, sound, duration) {
      const time24 = `${hour}:${minute}`;
      alarms.push({
        id: Date.now(),
        time24: time24,
        label: label,
        sound: sound,
        duration: duration,
        triggered: false
      });
      renderAlarms();
    }

    function deleteAlarm(id) {
      stopRinging(id);
      alarms = alarms.filter(a => a.id !== id);
      renderAlarms();
    }

    function getRandomVerse() {
      return dailyBreadVerses[Math.floor(Math.random() * dailyBreadVerses.length)];
    }

    function switchBackground(index) {
      const layers = document.querySelectorAll('.bg-layer');
      layers.forEach((layer, idx) => layer.classList.toggle('active', idx === index));
      if (!isCustomAnnouncementActive) quoteTextEl.innerText = getRandomVerse();
    }

    function nextBackground() {
      bgIndex = (bgIndex + 1) % document.querySelectorAll('.bg-layer').length;
      switchBackground(bgIndex);
    }

    document.getElementById('btnNextBgGlobal').addEventListener('click', () => {
      secondsElapsed = 0;
      nextBackground();
    });

    setInterval(() => {
      updateClock();
      if (autoRotate) {
        secondsElapsed++;
        if (secondsElapsed % cycleDuration === 0) nextBackground();
      }
    }, 1000);

    const menuBtn = document.getElementById('menuToggle');
    const drawer = document.getElementById('drawer');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const btnLockMode = document.getElementById('btnLockMode');
    const lockTriggerBtn = document.getElementById('lockTriggerBtn');
    const btnAddAlarm = document.getElementById('btnAddAlarm');
    const btnTestSound = document.getElementById('btnTestSound');
    const alarmLabelInput = document.getElementById('alarmLabelInput');
    const alarmSoundSelect = document.getElementById('alarmSoundSelect');
    const alarmDurationSelect = document.getElementById('alarmDurationSelect');
    const announcementInput = document.getElementById('announcementInput');

    menuBtn.addEventListener('click', () => drawer.classList.toggle('open'));
    btnTestSound.addEventListener('click', () => playAlarmSound(alarmSoundSelect.value));

    btnAddAlarm.addEventListener('click', () => {
      addAlarm(alarmHourSelect.value, alarmMinuteSelect.value, alarmLabelInput.value, alarmSoundSelect.value, alarmDurationSelect.value);
      alarmLabelInput.value = '';
    });

    announcementInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (val !== '') {
        isCustomAnnouncementActive = true;
        quoteBox.classList.add('custom-active');
        announcementTextEl.innerText = val;
      } else {
        isCustomAnnouncementActive = false;
        quoteBox.classList.remove('custom-active');
        announcementTextEl.innerText = "安得烈膳糧箱專案 — 陪伴弱勢孩童健康成長";
        quoteTextEl.innerText = getRandomVerse();
      }
    });

    // 強制全螢幕函數
    function requestFS() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        requestFS();
        btnFullscreen.innerText = '退出全螢幕';
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
        btnFullscreen.innerText = '開啟全螢幕';
      }
    });

    // --- 全螢幕鎖定與防逃脫自動補鎖機制 ---
    function lockScreen() {
      isLocked = true;
      drawer.classList.remove('open');
      menuBtn.style.display = 'none';
      lockTriggerBtn.style.display = 'block';
      requestFS();
    }

    function unlockScreen() {
      requestFS();

      setTimeout(() => {
        const inputPass = prompt("【全螢幕防逃脫保護】\n請輸入管理員解鎖密碼：");
        
        if (inputPass === UNLOCK_PASSWORD) {
          isLocked = false;
          menuBtn.style.display = 'flex';
          lockTriggerBtn.style.display = 'none';
          if (document.fullscreenElement && document.exitFullscreen) {
            document.exitFullscreen();
          }
          alert("解鎖成功！");
        } else if (inputPass !== null) {
          alert("密碼錯誤，無法解鎖！");
          requestFS();
        } else {
          // 點擊「取消」或按 ESC 離開輸入框時：立刻補回全螢幕
          requestFS();
        }
      }, 50);
    }

    btnLockMode.addEventListener('click', lockScreen);
    lockTriggerBtn.addEventListener('click', unlockScreen);

    // 監聽全螢幕狀態變化：當按 ESC 被瀏覽器退出時，0.1 秒內自動再次進入全螢幕
    document.addEventListener('fullscreenchange', () => {
      if (isLocked && !document.fullscreenElement) {
        setTimeout(() => {
          requestFS();
        }, 100);
      }
    });

    // 鎖定狀態下，點擊畫面上任何區域自動補全螢幕
    window.addEventListener('click', () => {
      if (isLocked && !document.fullscreenElement) {
        requestFS();
      }
    });

    // 防按鍵快捷離場 (F11 / ESC)
    window.addEventListener('keydown', (e) => {
      if (isLocked) {
        if (e.key === 'F11' || e.key === 'Escape' || e.keyCode === 122 || e.keyCode === 27) {
          e.preventDefault();
          e.stopPropagation();
          requestFS();
          return false;
        }
      }
    }, true);

    window.addEventListener('contextmenu', (e) => {
      if (isLocked) e.preventDefault();
    });

    initAlarmSelects();
    quoteTextEl.innerText = getRandomVerse();
    updateClock();
  </script>
</body>
</html>
