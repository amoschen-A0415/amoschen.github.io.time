<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社團法人中華安得烈慈善協會 - 全螢幕大字體數位時鐘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-blue: #00529B;
      --accent-gold: #F5A623;
      --warm-amber: #FF9800;
      --soft-white: #F8FAF9;
      --glass-bg: rgba(7, 24, 48, 0.45);
      --glass-border: rgba(255, 255, 255, 0.25);
      --shadow-color: rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #031020;
      color: var(--soft-white);
    }

    /* 牆面與動態背景 */
    .bg-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
      background-size: cover;
      background-position: center;
      transform: scale(1.02);
    }

    .bg-layer.active {
      opacity: 1;
    }

    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(3, 16, 32, 0.25) 0%, rgba(2, 10, 20, 0.8) 100%);
      z-index: 2;
    }

    .bg-svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 主版面佈局 */
    .clock-app-container {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.2vh 2vw;
    }

    /* 頂部標題列 */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 32px;
      background: rgba(0, 30, 60, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 20px;
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .official-logo-box {
      height: 85px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 15px rgba(245, 166, 35, 0.5));
    }

    .brand-titles {
      display: flex;
      flex-direction: column;
    }

    .brand-title-main {
      font-size: clamp(2.5rem, 4.2vh, 3.8rem);
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #FFFFFF 0%, #E0EBF5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 3px 12px rgba(0,0,0,0.6);
      line-height: 1.1;
    }

    .brand-title-sub {
      font-size: clamp(1.2rem, 2vh, 1.8rem);
      color: var(--accent-gold);
      letter-spacing: 2px;
      font-weight: 700;
      margin-top: 2px;
    }

    .date-lunar-display {
      text-align: right;
    }

    .date-text {
      font-size: clamp(1.8rem, 3.2vh, 2.6rem);
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 1px;
    }

    .lunar-text {
      font-size: clamp(1.2rem, 2vh, 1.6rem);
      color: #D1E3F8;
      margin-top: 2px;
    }

    /* 核心時間框 */
    .main-clock-card {
      position: relative;
      width: 100%;
      height: 56vh;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.05), 0 20px 50px rgba(0,0,0,0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 0 1vw;
    }

    .time-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .time-hm {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(14rem, 42vh, 38vw);
      font-weight: 700;
      line-height: 0.75;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      text-shadow: 
        0 0 40px rgba(255, 255, 255, 0.25),
        0 12px 35px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
      display: flex;
      align-items: center;
    }

    .colon {
      color: var(--accent-gold);
      display: inline-block;
      margin: 0 -0.01em;
      animation: pulseColon 2s infinite;
      text-shadow: 0 0 25px rgba(245, 166, 35, 0.7);
    }

    .alarm-icons-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .alarm-icon-item {
      font-size: clamp(2.5rem, 6vh, 5rem);
      animation: pulseAlarm 2s infinite alternate;
      filter: drop-shadow(0 0 10px var(--accent-gold));
    }

    @keyframes pulseAlarm {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.18); opacity: 1; }
    }

    @keyframes pulseColon {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .seconds-badge {
      position: absolute;
      bottom: 2vh;
      right: 2.5vw;
      background: rgba(0, 20, 45, 0.75);
      border: 1.5px solid var(--accent-gold);
      border-radius: 16px;
      padding: 0.4vh 1.8vw;
      display: flex;
      align-items: baseline;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .seconds-label {
      font-size: 1.2rem;
      color: var(--accent-gold);
      font-weight: 700;
    }

    .time-sec {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(3rem, 8vh, 6.5vw);
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1;
    }

    .ampm-tag {
      position: absolute;
      top: 2.5vh;
      left: 2.5vw;
      font-size: clamp(1.8rem, 4.5vh, 3vw);
      font-weight: 900;
      color: var(--accent-gold);
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 20px;
      border-radius: 10px;
      border: 1px solid rgba(245, 166, 35, 0.4);
      letter-spacing: 2px;
    }

    /* 底部區域 */
    footer {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quote-box {
      width: 100%;
      background: rgba(0, 25, 50, 0.65);
      border-left: 10px solid var(--accent-gold);
      padding: 18px 36px;
      border-radius: 0 20px 20px 0;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      min-height: 13vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .quote-text {
      font-size: clamp(1.8rem, 3.2vh, 2.6rem);
      font-weight: 700;
      color: #E2EFFC;
      letter-spacing: 1.5px;
      line-height: 1.35;
      transition: opacity 0.5s ease;
    }

    .announcement-text {
      font-size: clamp(2.8rem, 5vh, 4.2rem);
      font-weight: 900;
      color: var(--warm-amber);
      margin-top: 8px;
      letter-spacing: 2px;
      text-shadow: 0 3px 12px rgba(0,0,0,0.8);
      line-height: 1.2;
    }

    /* 自訂公告全版模式 (佔用原本兩列的大小與空間) */
    .quote-box.custom-active .quote-text {
      display: none;
    }

    .quote-box.custom-active .announcement-text {
      font-size: clamp(3.8rem, 7vh, 6rem);
      color: #FFD580;
      margin-top: 0;
      text-align: center;
    }

    /* 控制面板選單 */
    .menu-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 100;
      background: rgba(0, 40, 80, 0.6);
      border: 1px solid var(--glass-border);
      color: white;
      width: 48px;
      height: 48px;
      font-size: 1.4rem;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s;
      opacity: 0.4;
    }

    .menu-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .drawer {
      position: fixed;
      top: 0;
      right: -450px;
      width: 420px;
      height: 100%;
      background: rgba(4, 18, 36, 0.96);
      backdrop-filter: blur(20px);
      z-index: 90;
      box-shadow: -10px 0 30px rgba(0,0,0,0.8);
      padding: 30px 25px;
      transition: right 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 18px;
      border-left: 1px solid var(--glass-border);
      overflow-y: auto;
    }

    .drawer.open {
      right: 0;
    }

    .drawer-title {
      font-size: 1.4rem;
      color: var(--accent-gold);
      border-bottom: 2px solid rgba(245, 166, 35, 0.3);
      padding-bottom: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      font-size: 1rem;
      color: #B0C4DE;
      font-weight: bold;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn.active, .btn:hover {
      background: var(--primary-blue);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .input-field, .select-field {
      width: 100%;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--glass-border);
      color: white;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .select-field option {
      background: #041224;
      color: white;
    }

    .alarm-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 140px;
      overflow-y: auto;
    }

    .alarm-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.08);
      padding: 8px 12px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-gold);
    }

    .alarm-time-label {
      font-size: 1rem;
      font-weight: bold;
      color: #FFF;
    }

    .alarm-delete-btn {
      background: #ff4d4d;
      border: none;
      color: white;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* 鬧鐘響鈴 Modal */
    .alarm-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(2, 16, 35, 0.96);
      border: 3px solid var(--accent-gold);
      box-shadow: 0 0 50px rgba(245, 166, 35, 0.6);
      padding: 40px;
      border-radius: 24px;
      z-index: 200;
      text-align: center;
      display: none;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .alarm-modal.active {
      display: block;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .alarm-modal-title {
      font-size: 3rem;
      color: var(--accent-gold);
      margin-bottom: 15px;
    }

    .alarm-modal-desc {
      font-size: 2rem;
      color: #FFF;
      margin-bottom: 25px;
    }
  </style>
</head>
<body>

  <!-- 控制面板觸發鈕 -->
  <button class="menu-btn" id="menuToggle">⚙️</button>

  <!-- 側邊控制面板 -->
  <div class="drawer" id="drawer">
    <div class="drawer-title">顯示與鬧鐘設定</div>
    
    <div class="control-group">
      <div class="control-label">時間制</div>
      <div class="btn-row">
        <button class="btn active" id="btn24h">24 小時制</button>
        <button class="btn" id="btn12h">12 小時制</button>
      </div>
    </div>

    <div class="control-group">
      <div class="control-label">背景與經文輪播 (每30秒)</div>
      <div class="btn-row">
        <button class="btn active" id="btnPauseBg">自動播放</button>
        <button class="btn" id="btnNextBg">切換下一張</button>
      </div>
    </div>

    <!-- 鬧鐘與鈴聲選擇區 -->
    <div class="control-group">
      <div class="control-label">新增鬧鐘設定</div>
      <div class="btn-row" style="gap:5px;">
        <input type="time" id="alarmTimeInput" class="input-field" style="flex:2;">
        <input type="text" id="alarmLabelInput" class="input-field" placeholder="標籤 (選填)" style="flex:2;">
      </div>
      
      <div class="control-label" style="margin-top: 5px;">鬧鐘鈴聲 (5種選擇)</div>
      <div class="btn-row" style="gap:5px;">
        <select id="alarmSoundSelect" class="select-field" style="flex:3;">
          <option value="sound1">🔔 經典清脆 (Classic Chime)</option>
          <option value="sound2">🎵 溫和和弦 (Soft Chord)</option>
          <option value="sound3">🚨 急促警示 (Urgent Alert)</option>
          <option value="sound4">⛪ 優雅鐘聲 (Church Bell)</option>
          <option value="sound5">📟 活力嗶嗶 (Digital Beep)</option>
        </select>
        <button class="btn" id="btnTestSound" style="flex:1; font-size:0.85rem;">試聽</button>
      </div>

      <button class="btn" id="btnAddAlarm" style="background:var(--primary-blue); color:var(--accent-gold); margin-top: 5px;">＋ 新增鬧鐘</button>
      
      <div class="alarm-list" id="alarmList"></div>
    </div>

    <div class="control-group">
      <div class="control-label">自訂活動公告 (填寫將覆蓋經文輪播)</div>
      <input type="text" id="announcementInput" class="input-field" placeholder="留空時恢復《靈命日糧》50則經文輪播...">
    </div>

    <div class="control-group" style="margin-top: auto; padding-top: 10px;">
      <button class="btn" id="btnFullscreen" style="background: var(--accent-gold); color: #000;">開啟全螢幕</button>
    </div>
  </div>

  <!-- 鬧鐘響鈴提示 Modal -->
  <div class="alarm-modal" id="alarmModal">
    <div class="alarm-modal-title">⏰ 鬧鐘提醒</div>
    <div class="alarm-modal-desc" id="alarmModalDesc">時間到了！</div>
    <button class="btn" id="btnCloseAlarm" style="background: var(--accent-gold); color: #000; font-size: 1.5rem; padding: 10px 30px;">我知道了</button>
  </div>

  <!-- 動態背景層 -->
  <div class="bg-stage">
    <div class="bg-layer active" id="bg1">
      <svg class="bg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="bgG1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#021B38"/>
            <stop offset="50%" stop-color="#003366"/>
            <stop offset="100%" stop-color="#00152B"/>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#bgG1)"/>
        <circle cx="960" cy="540" r="480" fill="none" stroke="rgba(245, 166, 35, 0.08)" stroke-width="2"/>
        <path d="M 0,800 Q 480,700 960,850 T 1920,750 L 1920,1080 L 0,1080 Z" fill="rgba(0, 82, 155, 0.3)"/>
        <path d="M 0,850 Q 550,950 1100,820 T 1920,900 L 1920,1080 L 0,1080 Z" fill="rgba(245, 166, 35, 0.12)"/>
      </svg>
    </div>

    <div class="bg-layer" id="bg2">
      <svg class="bg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="bgG2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0A2540"/>
            <stop offset="60%" stop-color="#004080"/>
            <stop offset="100%" stop-color="#051329"/>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#bgG2)"/>
        <path d="M-100,200 C 400,100 800,500 1920,100 L 1920,1080 L -100,1080 Z" fill="rgba(255, 152, 0, 0.08)"/>
        <circle cx="300" cy="300" r="280" fill="rgba(0, 82, 155, 0.25)"/>
      </svg>
    </div>

    <div class="bg-layer" id="bg3">
      <svg class="bg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="bgG3" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#001F3F"/>
            <stop offset="50%" stop-color="#002D5A"/>
            <stop offset="100%" stop-color="#081426"/>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#bgG3)"/>
        <polygon points="0,0 1920,1080 0,1080" fill="rgba(0, 82, 155, 0.15)"/>
      </svg>
    </div>

    <div class="bg-layer" id="bg4">
      <svg class="bg-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="bgG4" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#051A30"/>
            <stop offset="50%" stop-color="#032D55"/>
            <stop offset="100%" stop-color="#010D1B"/>
          </linearGradient>
        </defs>
        <rect width="100%" height="100%" fill="url(#bgG4)"/>
        <circle cx="1600" cy="200" r="400" fill="rgba(245, 166, 35, 0.06)"/>
      </svg>
    </div>
    
    <div class="bg-overlay"></div>
  </div>

  <!-- 主介面 -->
  <div class="clock-app-container">
    
    <!-- 頂部標題列 -->
    <header>
      <div class="brand-section">
        <div class="official-logo-box">
          <svg width="150" height="85" viewBox="0 0 220 130" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g transform="rotate(-7, 50, 35)">
              <rect x="5" y="5" width="82" height="78" rx="4" fill="#8C531B"/>
              <path d="M18 72 Q 42 45 70 14" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
              <path d="M 32 52 Q 18 44 20 36 Q 34 42 37 50 Z" fill="#FFFFFF"/>
              <path d="M 38 48 Q 52 40 54 31 Q 40 34 36 45 Z" fill="#FFFFFF"/>
              <path d="M 45 38 Q 31 30 33 21 Q 47 27 48 35 Z" fill="#FFFFFF"/>
              <path d="M 52 33 Q 66 23 68 15 Q 54 18 49 29 Z" fill="#FFFFFF"/>
              <path d="M 58 23 Q 48 13 50 6 Q 62 12 61 20 Z" fill="#FFFFFF"/>
            </g>
            <g transform="rotate(7, 150, 35)">
              <rect x="102" y="8" width="82" height="78" rx="4" fill="#7FA827"/>
              <path d="M143 64 C126 48 116 34 132 23 C143 15 153 26 156 29 C159 26 169 15 180 23 C196 34 186 48 169 64 L156 75 Z" fill="#FFFFFF"/>
            </g>
            <g transform="rotate(-12, 45, 95)">
              <rect x="8" y="75" width="78" height="82" rx="4" fill="#A06822"/>
              <g transform="translate(20, 86) rotate(-38) scale(0.72)">
                <path d="M 10 30 Q 38 3 75 30 Q 38 57 10 30 Z" fill="#7FA827"/>
                <path d="M 10 30 L -12 12 L -6 30 L -12 48 Z" fill="#7FA827"/>
              </g>
            </g>
          </svg>
        </div>

        <div class="brand-titles">
          <span class="brand-title-main">社團法人中華安得烈慈善協會</span>
          <span class="brand-title-sub">ANDREW CHARITY ASSOCIATION</span>
        </div>
      </div>

      <div class="date-lunar-display">
        <div class="date-text" id="dateText">2026年10月19日 星期一</div>
        <div class="lunar-text" id="lunarText">農曆丙午年九月十日</div>
      </div>
    </header>

    <!-- 核心時間框 -->
    <main class="main-clock-card">
      <div class="ampm-tag" id="ampmTag" style="display: none;">AM</div>
      
      <div class="time-wrapper">
        <div class="time-hm">
          <span id="hours">09</span>
          <span class="colon">:</span>
          <span id="minutes">37</span>
        </div>
        
        <div class="alarm-icons-container" id="alarmIconsContainer"></div>
      </div>

      <div class="seconds-badge">
        <span class="seconds-label">SEC</span>
        <span class="time-sec" id="seconds">00</span>
      </div>
    </main>

    <!-- 底部：經文輪播與公告 -->
    <footer>
      <div class="quote-box" id="quoteBox">
        <div class="quote-text" id="quoteText">「主耶和華的靈在我身上，因為耶和華用膏膏我，叫我傳好信息給貧窮的人。」— 以賽亞書 61:1</div>

      </div>
    </footer>

  </div>

  <script>
    // --- 50 則《靈命日糧》精選經文數據庫 ---
    const dailyBreadVerses = [
      "「主耶和華的靈在我身上，因為耶和華用膏膏我，叫我傳好信息給貧窮的人。」— 以賽亞書 61:1",

      "「神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。」— 腓立比書 4:7",

      "「耶和華的慈愛永不止息，祂的憐憫永不斷絕，每早晨這都是新的。」— 耶利米哀歌 3:22-23",
      "「愛是恆久忍耐，又有恩慈；愛是不嫉妒，愛是不自誇，不張狂。」— 哥林多前書 13:4",
      "「如今常存的有信，有望，有愛這三樣，其中最大的是愛。」— 哥林多前書 13:13",
      "「你們光也當這樣照在人前，叫他們看見你們的好行為，便將榮耀歸給你們在天上的父。」— 馬太福音 5:16",
      "「神就是愛；住在愛裡面的，就是住在神裡面，神也住在祂裡面。」— 約翰一書 4:16",
      "「喜樂的心乃是良藥；憂傷的靈使骨枯乾。」— 箴言 17:22",
      "「但那等候耶和華的必重新得力。他們必如鷹展翅上騰；他們奔跑卻不困倦，行走卻不疲乏。」— 以賽亞書 40:31",
      "「我靠著那加給我力量的，凡事都能作。」— 腓立比書 4:13",
      "「你們要生發仁愛的心，彼此相待，用溫柔的心互相包容。」— 以弗所書 4:2",
      "「當將你的事交託耶和華，並倚靠祂，祂就必成全。」— 詩篇 37:5",
      "「你的話是我腳前的燈，是我路上的光。」— 詩篇 119:105",
      "「耶和華近前聽求告祂的人，就是誠心求告祂的人。」— 詩篇 145:18",
      "「忍受試煉的人是有福的，因為他經過試驗以後，必得生命的冠冕。」— 雅各書 1:12",
      "「你們要彼此相愛，像我愛你們一樣，這就是我的命令。」— 約翰福音 15:12",
      "「我們曉得萬事都互相效力，叫愛神的人得益處。」— 羅馬書 8:28",
      "「若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。」— 哥林多後書 5:17",
      "「恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。」— 以弗所書 4:32",
      "「你要保守你心，勝過保守一切，因為一生的一效是由心發出。」— 箴言 4:23",
      "「耶和華是我的亮光，是我的拯救，我還怕誰呢？」— 詩篇 27:1",
      "「得勝的，我要賜他在我寶座上與我同坐。」— 啟示錄 3:21",
      "「凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。」— 馬太福音 11:28",
      "「這是我所命令你的：你當剛強壯膽！不要懼怕，也不要驚晃。」— 約書亞記 1:9",
      "「你們要敬畏耶和華，誠誠實實地盡心事奉祂，想念祂為你們所做的事何等的大。」— 撒母耳記上 12:24",
      "「愛人不可虛假；惡，要厭惡；善，要親近。」— 羅馬書 12:9",
      "「在患難中要忍耐，禱告要恆心。」— 羅馬書 12:12",
      "「少種的少收，多種的多收，這話是真的。」— 哥林多後書 9:6",
      "「我們行善，不可喪志；若不灰心，到了時候就要收成。」— 加拉太書 6:9",
      "「要常常喜樂，不住地禱告，凡事謝恩；因為這是神在基督耶穌裡向你們所定的旨意。」— 帖撒羅尼迦前書 5:16-18",
      "「但願使人有盼望的神，因信將諸般的喜樂、平安充滿你們的心。」— 羅馬書 15:13",
      "「耶和華必為你們爭戰，你們只管靜默，不要作聲。」— 出埃及記 14:14",
      "「神為愛祂的人所預備的是眼睛未曾看見，耳朵未曾聽見的。」— 哥林多前書 2:9",
      "「流淚撒種的，必歡呼收割！」— 詩篇 126:5",
      "「你的日子如何，你的力量也必如何。」— 申命記 33:25",
      "「我留下平安給你們；我將我的平安賜給你們。」— 約翰福音 14:27",
      "「神是我們的避難所，是我們的力量，是我們在患難中隨時的幫助。」— 詩篇 46:1",
      "「堅心倚賴你的，你必保守他十分平安，因為他倚靠你。」— 以賽亞書 26:3",
      "「凡事謙虛、溫柔、忍耐，用愛心互相寬容。」— 以弗所書 4:2",
      "「主是我在急難中的力量，是我心中的磐石。」— 詩篇 73:26",
      "「要彼此相愛，像我愛你們一樣；這是我的命令。」— 約翰福音 15:12",
      "「主的恩典乃是一生之久；一宿雖有哭泣，早晨便必歡呼。」— 詩篇 30:5",
      "「你們要嘗嘗主恩的滋味，便知祂是美善；投靠祂的人有福了！」— 詩篇 34:8"
    ];

    // --- 狀態控制 ---
    let is24Hour = true;
    let autoRotate = true;
    let bgIndex = 0;
    const cycleDuration = 30; // 30 秒輪播
    let secondsElapsed = 0;
    let alarms = []; // 鬧鐘陣列 [{ id, time, label, sound, triggered }]
    let isCustomAnnouncementActive = false;

    // Web Audio API 音效合成器 (產生 5 種鈴聲)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playAlarmSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const now = audioCtx.currentTime;

      switch(type) {
        case 'sound1': // 經典清脆
          playTone(523.25, now, 0.15, 'sine');
          playTone(659.25, now + 0.15, 0.15, 'sine');
          playTone(783.99, now + 0.3, 0.3, 'sine');
          break;
        case 'sound2': // 溫和和弦
          playTone(440, now, 0.6, 'triangle');
          playTone(554.37, now + 0.05, 0.6, 'triangle');
          playTone(659.25, now + 0.1, 0.6, 'triangle');
          break;
        case 'sound3': // 急促警示
          for(let i=0; i<4; i++) {
            playTone(880, now + i*0.12, 0.08, 'sawtooth');
          }
          break;
        case 'sound4': // 優雅鐘聲
          playTone(329.63, now, 1.2, 'sine');
          playTone(261.63, now + 0.4, 1.5, 'sine');
          break;
        case 'sound5': // 活力嗶嗶
          playTone(1046.50, now, 0.08, 'square');
          playTone(1046.50, now + 0.15, 0.08, 'square');
          playTone(1046.50, now + 0.3, 0.15, 'square');
          break;
      }
    }

    function playTone(freq, startTime, duration, type='sine') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.3, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    // --- DOM 元素 ---
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const ampmTag = document.getElementById('ampmTag');
    const dateTextEl = document.getElementById('dateText');
    const quoteBox = document.getElementById('quoteBox');
    const quoteTextEl = document.getElementById('quoteText');
    const announcementTextEl = document.getElementById('announcementText');
    const alarmIconsContainer = document.getElementById('alarmIconsContainer');
    const alarmList = document.getElementById('alarmList');
    const alarmModal = document.getElementById('alarmModal');
    const alarmModalDesc = document.getElementById('alarmModalDesc');

    // --- 時間與鬧鐘監測 ---
    function updateClock() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');

      const currentTimeStr = `${String(h).padStart(2, '0')}:${m}`;

      if (!is24Hour) {
        ampmTag.style.display = 'block';
        ampmTag.innerText = h >= 12 ? 'PM' : 'AM';
        h = h % 12 || 12;
      } else {
        ampmTag.style.display = 'none';
      }

      hoursEl.innerText = String(h).padStart(2, '0');
      minutesEl.innerText = m;
      secondsEl.innerText = s;

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const dayName = days[now.getDay()];

      dateTextEl.innerText = `${year}年${month}月${date}日 ${dayName}`;

      // 鬧鐘響鈴偵測
      if (s === '00') {
        alarms.forEach(alarm => {
          if (alarm.time === currentTimeStr && !alarm.triggered) {
            triggerAlarm(alarm);
          }
        });
      }
    }

    function triggerAlarm(alarm) {
      alarm.triggered = true;
      playAlarmSound(alarm.sound);
      // 連續響鈴 3 次
      setTimeout(() => playAlarmSound(alarm.sound), 1000);
      setTimeout(() => playAlarmSound(alarm.sound), 2000);

      alarmModalDesc.innerText = alarm.label ? `鬧鐘：${alarm.label} (${alarm.time})` : `鬧鐘時間 (${alarm.time}) 到了！`;
      alarmModal.classList.add('active');
    }

    document.getElementById('btnCloseAlarm').addEventListener('click', () => {
      alarmModal.classList.remove('active');
    });

    // 渲染鬧鐘項目與數字右側圖示
    function renderAlarms() {
      alarmList.innerHTML = '';
      alarmIconsContainer.innerHTML = '';

      alarms.forEach((alarm) => {
        const item = document.createElement('div');
        item.className = 'alarm-item';
        item.innerHTML = `
          <div class="alarm-time-label">⏰ ${alarm.time} <span style="font-size:0.85rem; color:#F5A623;">${alarm.label ? ' - ' + alarm.label : ''}</span></div>
          <button class="alarm-delete-btn" onclick="deleteAlarm(${alarm.id})">刪除</button>
        `;
        alarmList.appendChild(item);

        const icon = document.createElement('div');
        icon.className = 'alarm-icon-item';
        icon.innerText = '⏰';
        icon.title = `鬧鐘: ${alarm.time} ${alarm.label}`;
        alarmIconsContainer.appendChild(icon);
      });
    }

    function addAlarm(time, label, sound) {
      if (!time) return;
      alarms.push({
        id: Date.now(),
        time: time,
        label: label,
        sound: sound,
        triggered: false
      });
      renderAlarms();
    }

    function deleteAlarm(id) {
      alarms = alarms.filter(a => a.id !== id);
      renderAlarms();
    }

    // --- 隨機抽取《靈命日糧》經文 ---
    function getRandomVerse() {
      const randomIndex = Math.floor(Math.random() * dailyBreadVerses.length);
      return dailyBreadVerses[randomIndex];
    }

    // --- 背景與經文輪播 ---
    function switchBackground(index) {
      const layers = document.querySelectorAll('.bg-layer');
      layers.forEach((layer, idx) => {
        layer.classList.toggle('active', idx === index);
      });

      // 當無自訂公告時，隨機輪播經文
      if (!isCustomAnnouncementActive) {
        quoteTextEl.innerText = getRandomVerse();
      }
    }

    function nextBackground() {
      const totalBgs = document.querySelectorAll('.bg-layer').length;
      bgIndex = (bgIndex + 1) % totalBgs;
      switchBackground(bgIndex);
    }

    // --- 30 秒自動輪播計時 ---
    setInterval(() => {
      updateClock();

      if (autoRotate) {
        secondsElapsed++;
        if (secondsElapsed % cycleDuration === 0) {
          nextBackground();
        }
      }
    }, 1000);

    // --- 控制選單事件監聽 ---
    const menuBtn = document.getElementById('menuToggle');
    const drawer = document.getElementById('drawer');
    const btn24h = document.getElementById('btn24h');
    const btn12h = document.getElementById('btn12h');
    const btnPauseBg = document.getElementById('btnPauseBg');
    const btnNextBg = document.getElementById('btnNextBg');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const btnAddAlarm = document.getElementById('btnAddAlarm');
    const btnTestSound = document.getElementById('btnTestSound');
    const alarmTimeInput = document.getElementById('alarmTimeInput');
    const alarmLabelInput = document.getElementById('alarmLabelInput');
    const alarmSoundSelect = document.getElementById('alarmSoundSelect');
    const announcementInput = document.getElementById('announcementInput');

    menuBtn.addEventListener('click', () => drawer.classList.toggle('open'));

    btn24h.addEventListener('click', () => {
      is24Hour = true;
      btn24h.classList.add('active');
      btn12h.classList.remove('active');
      updateClock();
    });

    btn12h.addEventListener('click', () => {
      is24Hour = false;
      btn12h.classList.add('active');
      btn24h.classList.remove('active');
      updateClock();
    });

    btnPauseBg.addEventListener('click', () => {
      autoRotate = !autoRotate;
      btnPauseBg.innerText = autoRotate ? '自動播放' : '已暫停';
      btnPauseBg.classList.toggle('active', autoRotate);
    });

    btnNextBg.addEventListener('click', () => {
      secondsElapsed = 0;
      nextBackground();
    });

    btnTestSound.addEventListener('click', () => {
      playAlarmSound(alarmSoundSelect.value);
    });

    btnAddAlarm.addEventListener('click', () => {
      addAlarm(alarmTimeInput.value, alarmLabelInput.value, alarmSoundSelect.value);
      alarmTimeInput.value = '';
      alarmLabelInput.value = '';
    });

    // 輸入自訂公告時：暫停經文輪播並放大佔用整區
    announcementInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      if (val !== '') {
        isCustomAnnouncementActive = true;
        quoteBox.classList.add('custom-active');
        announcementTextEl.innerText = val;
      } else {
        isCustomAnnouncementActive = false;
        quoteBox.classList.remove('custom-active');
        announcementTextEl.innerText = "安得烈膳糧箱專案 — 陪伴弱勢孩童健康成長";
        quoteTextEl.innerText = getRandomVerse();
      }
    });

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        btnFullscreen.innerText = '退出全螢幕';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          btnFullscreen.innerText = '開啟全螢幕';
        }
      }
    });

    // 初始化執行
    quoteTextEl.innerText = getRandomVerse();
    updateClock();
  </script>
</body>
